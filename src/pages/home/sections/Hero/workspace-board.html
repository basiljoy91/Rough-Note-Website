<div class="d1-workspace-stage" data-hero-workspace>
  <span class="d1-workspace-tape" aria-hidden="true"></span>
  <span class="d1-workspace-paperclip" aria-hidden="true"><i></i></span>
  <span class="d1-workspace-pencil" aria-hidden="true"><i></i></span>
  <span class="d1-workspace-coffee-ring" aria-hidden="true"></span>

  <article class="d1-process-sheet" aria-label="From idea to product launch">
    <span class="d1-sheet-crease d1-sheet-crease-one" aria-hidden="true"></span>
    <span class="d1-sheet-crease d1-sheet-crease-two" aria-hidden="true"></span>
    <span class="d1-sheet-fold" aria-hidden="true"></span>

    <div class="d1-flow-note d1-flow-note-idea">
      <div class="d1-note-heading">
        <span>Idea</span>
        <span class="d1-note-star" aria-hidden="true">☆</span>
      </div>
      <button
        class="d1-idea-button"
        type="button"
        aria-label="Light up your brain"
        aria-pressed="false"
        data-idea-bulb
      >
        <span class="d1-idea-glow" aria-hidden="true"></span>
        <i class="fa-regular fa-lightbulb" aria-hidden="true"></i>
      </button>
    </div>

    <span class="d1-flow-arrow d1-flow-arrow-one" aria-hidden="true">↓</span>

    <div class="d1-flow-note d1-flow-note-dashboard">
      <div class="d1-note-heading">Dashboard</div>
      <div class="d1-dashboard-sketch" aria-hidden="true">
        <span class="d1-dashboard-line d1-dashboard-line-one"></span>
        <span class="d1-dashboard-line d1-dashboard-line-two"></span>
        <span class="d1-dashboard-line d1-dashboard-line-three"></span>
        <span class="d1-dashboard-card"></span>
        <span class="d1-dashboard-pie"></span>
      </div>
    </div>

    <span class="d1-flow-arrow d1-flow-arrow-two" aria-hidden="true">↓</span>

    <div class="d1-flow-note d1-flow-note-automation">
      <div class="d1-note-heading">Automation</div>
      <div class="d1-robot-sketch" aria-hidden="true">
        <span class="d1-robot-antenna"></span>
        <span class="d1-robot-ear d1-robot-ear-left"></span>
        <span class="d1-robot-ear d1-robot-ear-right"></span>
        <i></i><i></i>
        <b></b>
      </div>
    </div>

    <span class="d1-flow-arrow d1-flow-arrow-three" aria-hidden="true">↓</span>

    <div class="d1-flow-note d1-flow-note-launch">
      <div class="d1-rocket-sketch" aria-hidden="true">
        <span class="d1-rocket-window"></span>
        <span class="d1-rocket-flame"></span>
      </div>
      <div class="d1-note-heading">Launch</div>
    </div>

    <div class="d1-needs-ai-note">
      <span
        data-type-text="needs AI"
        data-type-delay="700"
      >needs AI</span>
      <i class="d1-needs-ai-arrow" aria-hidden="true"></i>
    </div>

    <div class="d1-wireframe-sketch" aria-hidden="true">
      <span class="d1-wireframe-dots">•••</span>
      <span class="d1-wireframe-image"></span>
      <span class="d1-wireframe-small-box"></span>
      <span class="d1-wireframe-copy d1-wireframe-copy-one"></span>
      <span class="d1-wireframe-copy d1-wireframe-copy-two"></span>
      <span class="d1-wireframe-copy d1-wireframe-copy-three"></span>
    </div>

    <span class="d1-loose-squiggle" aria-hidden="true"></span>

    <div class="d1-mvp-note">
      <span class="d1-mvp-stars" aria-hidden="true">☆</span>
      <span
        data-type-text="MVP&#10;Ready!"
        data-type-delay="3400"
      >MVP<br>Ready!</span>
      <i class="d1-mvp-arrow" aria-hidden="true"></i>
    </div>
  </article>
</div>
