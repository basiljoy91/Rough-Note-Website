      <!-- Realistic Torn Edge spanning full width with folded corner -->
      <div class="d1-hero-tear">
        <!-- SVG patch to seamlessly cover the left-side black gap in the image -->
        <svg class="d1-hero-tear-left-patch" width="100%" height="100%" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="patch-tear-filter" color-interpolation-filters="sRGB" x="-20%" y="-20%" width="140%" height="200%">
              <feTurbulence type="fractalNoise" baseFrequency="0.03 0.3" numOctaves="4" result="noise" />
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            <!-- Fades out to the right so the patch blends seamlessly into the image's torn edge -->
            <linearGradient id="patch-fade" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="50%" stop-color="#F8F3EA" stop-opacity="1" />
              <stop offset="90%" stop-color="#F8F3EA" stop-opacity="0" />
            </linearGradient>
          </defs>
          <rect x="-10%" y="-10%" width="120%" height="100%" fill="url(#patch-fade)" filter="url(#patch-tear-filter)" />
        </svg>

        <img src="/assets/torn-edge-bottom.jpg" alt="Torn paper edge" class="d1-hero-tear-img" />
      </div>
