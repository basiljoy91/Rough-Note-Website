<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rough Note | 404 Page Not Found</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Patrick+Hand&family=Shadows+Into+Light&display=swap" rel="stylesheet">
    
</head>
<body>
    <div id="app"></div>
    <template id="not-found-template">
    <!-- LAYER 2: The Underlying Paper (Background) -->
    <main class="underlying-paper">
        
        <!-- LAYER 1: The Torn Left Page -->
        <div class="left-notebook-layer">
            
            <!-- Spiral Binding (Pinned absolute left) -->
            <div class="not-found-spiral-binding">
                <div class="spiral-loop"><div class="hole"></div><div class="metal"></div></div>
                <div class="spiral-loop"><div class="hole"></div><div class="metal"></div></div>
                <div class="spiral-loop"><div class="hole"></div><div class="metal"></div></div>
                <div class="spiral-loop"><div class="hole"></div><div class="metal"></div></div>
                <div class="spiral-loop"><div class="hole"></div><div class="metal"></div></div>
                <div class="spiral-loop"><div class="hole"></div><div class="metal"></div></div>
                <div class="spiral-loop"><div class="hole"></div><div class="metal"></div></div>
                <div class="spiral-loop"><div class="hole"></div><div class="metal"></div></div>
                <div class="spiral-loop"><div class="hole"></div><div class="metal"></div></div>
                <div class="spiral-loop"><div class="hole"></div><div class="metal"></div></div>
                <div class="spiral-loop"><div class="hole"></div><div class="metal"></div></div>
                <div class="spiral-loop"><div class="hole"></div><div class="metal"></div></div>
                <div class="spiral-loop"><div class="hole"></div><div class="metal"></div></div>
                <div class="spiral-loop"><div class="hole"></div><div class="metal"></div></div>
            </div>

            <!-- The Paper Surface of the Left Page -->
            <div class="left-page-surface">
                
                <!-- Left Page Annotations -->
                <div class="left-annotations">
                    <div class="removed-note">
                        <span class="text">Removed.</span>
                        <div class="pencil-arrow"></div>
                    </div>
                    <div class="draft-stamp">DRAFT</div>
                </div>

                <!-- Highly complex, organic torn edge -->
                <div class="torn-edge-container">
                    <!-- The main ragged paper base -->
                    <div class="ragged-base"></div>
                    
                    <!-- Paper thickness and crushed edge layering -->
                    <div class="crushed-edge-overlay"></div>
                    
                    <!-- Hanging fibers and irregular chunks -->
                    <div class="fiber fiber-1"></div>
                    <div class="fiber fiber-2"></div>
                    <div class="fiber fiber-3"></div>
                    <div class="fiber fiber-4"></div>
                    <div class="fiber fiber-5"></div>
                    <div class="fiber fiber-6"></div>
                    <div class="fiber fiber-7"></div>
                    <div class="fiber fiber-8"></div>
                    <div class="fiber fiber-9"></div>
                    <div class="fiber fiber-10"></div>
                    <div class="fiber fiber-11"></div>
                    <div class="fiber fiber-12"></div>
                    <div class="fiber fiber-13"></div>
                    <div class="fiber fiber-14"></div>
                    <div class="fiber fiber-15"></div>
                    <div class="fiber fiber-16"></div>
                    <div class="fiber fiber-17"></div>
                    <div class="fiber fiber-18"></div>
                    <div class="fiber fiber-19"></div>
                    <div class="fiber fiber-20"></div>

                    <!-- Tiny broken fragments floating -->
                    <div class="fragment frag-1"></div>
                    <div class="fragment frag-2"></div>
                    <div class="fragment frag-3"></div>
                    <div class="fragment frag-4"></div>
                    <div class="fragment frag-5"></div>
                </div>
            </div>
            
        </div> <!-- End Layer 1 -->

        <!-- CONTENT ON UNDERLYING PAPER -->
        <div class="right-content-layer">
            
            <!-- Top Sticky Note (Clipped) -->
            <div class="sticky-note top-sticky">
                <div class="paper-clip">
                    <div class="clip-wire back-wire"></div>
                    <div class="clip-wire front-wire"></div>
                    <div class="clip-highlight"></div>
                    <div class="clip-shadow"></div>
                </div>
                <p>Lost<br>pages<br>happen.</p>
                <span class="smiley">:)</span>
            </div>

            <!-- Center Content (404) -->
            <div class="main-sketch-box">
                <!-- Independent Hand-Drawn Borders -->
                <div class="sketch-border border-top"></div>
                <div class="sketch-border border-right"></div>
                <div class="sketch-border border-bottom"></div>
                <div class="sketch-border border-left"></div>
                <!-- Corner decorations -->
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>

                <!-- Photorealistic 404 Scribble -->
                <div class="typography-404">
                    <span class="stroke stroke-1">404</span>
                    <span class="stroke stroke-2">404</span>
                    <span class="stroke stroke-3">404</span>
                    <span class="stroke stroke-4">404</span>
                    <span class="stroke stroke-5">404</span>
                    <!-- Decorative pencil lines -->
                    <div class="pencil-scratch p-left-1"></div>
                    <div class="pencil-scratch p-left-2"></div>
                    <div class="pencil-scratch p-right-1"></div>
                    <div class="pencil-scratch p-right-2"></div>
                </div>

                <h1 class="heading">
                    Oops... Looks like<br>
                    this page has been<br>
                    torn from our notebook.
                </h1>
                
                <div class="double-underline">
                    <div class="line one"></div>
                    <div class="line two"></div>
                </div>

                <p class="description">
                    Some ideas never make the final draft.<br>
                    Let's help you find another chapter.
                </p>

                <button class="back-home-btn" id="backHomeBtn">
                    <div class="btn-border"></div>
                    <span class="css-home-icon">
                        <span class="roof"></span>
                        <span class="house-body"></span>
                        <span class="door"></span>
                    </span>
                    Back to Home
                </button>
            </div>

            <!-- Bottom Sticky Note (Taped) -->
            <div class="sticky-note bottom-sticky">
                <div class="masking-tape"></div>
                <p>Maybe<br>this belongs<br>in another<br><span class="hand-underline">chapter.</span></p>
            </div>

            <!-- Bottom Right Quote -->
            <div class="quote-section">
                <p>Not every<br>page is a<br>mistake.</p>
                <div class="quote-line">
                    <div class="line one"></div>
                    <div class="line two"></div>
                </div>
            </div>

            <!-- Organic Coffee Stain -->
            <div class="coffee-stain-container">
                <div class="ring ring-main"></div>
                <div class="ring ring-inner"></div>
                <div class="ring ring-broken"></div>
                <div class="ring ring-fade"></div>
                <div class="splatter s-1"></div>
                <div class="splatter s-2"></div>
                <div class="splatter s-3"></div>
                <div class="splatter s-4"></div>
                <div class="splatter s-5"></div>
                <div class="splatter s-6"></div>
            </div>

        </div> <!-- End Content Layer -->

    </main>
    </template>

    <script type="module" src="/src/app/entrypoints/pagenotfound.tsx"></script>
</body>
</html>
